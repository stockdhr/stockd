<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>Prijava — Stockd</title><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="css/auth.css"></head>
<body class="auth-page"><main class="auth-shell"><div class="auth-brand">Stockd<span>.</span></div><section class="card auth-card"><h1>Dobro došli natrag.</h1><p>Prijavite se i provjerite kako posluje vaš resell posao.</p><form class="auth-form" id="loginForm"><div class="field"><label>Korisničko ime ili email</label><input name="identity" autocomplete="username" placeholder="vas@email.com" required autofocus></div><div class="field"><label>Lozinka</label><div class="password-wrap"><input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••••••" required><button type="button" class="icon-button" id="showPassword" aria-label="Prikaži lozinku">◉</button></div></div><div class="form-error" id="loginError" hidden></div><button class="primary-button" id="loginButton">Prijavi se</button></form></section><p class="auth-foot">Račun otvara administrator. Trebate pomoć? Kontaktirajte administratora.</p></main><script type="module">import{api,demoMode}from'./js/api.js';const form=document.querySelector('#loginForm'),error=document.querySelector('#loginError'),button=document.querySelector('#loginButton');document.querySelector('#showPassword').onclick=()=>{const p=document.querySelector('#password');p.type=p.type==='password'?'text':'password'};form.onsubmit=async e=>{e.preventDefault();error.hidden=true;button.disabled=true;button.textContent='Prijava…';try{if(!demoMode)await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});location.href='index.html'}catch(err){error.textContent=err.message;error.hidden=false}finally{button.disabled=false;button.textContent='Prijavi se'}};</script></body></html>
