<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>Promjena lozinke — Stockd</title><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="css/auth.css"></head>
<body class="auth-page"><main class="auth-shell"><div class="auth-brand">Stockd<span>.</span></div><section class="card auth-card"><h1>Postavite novu lozinku.</h1><p>Privremenu lozinku morate promijeniti prije nastavka. Koristite najmanje 12 znakova.</p><form class="auth-form" id="passwordForm"><div class="field"><label>Privremena lozinka</label><input type="password" name="current_password" autocomplete="current-password" required autofocus></div><div class="field"><label>Nova lozinka</label><input type="password" name="new_password" minlength="12" autocomplete="new-password" required></div><div class="field"><label>Ponovite novu lozinku</label><input type="password" name="confirmation" minlength="12" autocomplete="new-password" required></div><div class="form-error" id="formError" hidden></div><button class="primary-button" id="saveButton">Spremi novu lozinku</button></form></section></main><script type="module">import{api}from'./js/api.js';const form=document.querySelector('#passwordForm'),error=document.querySelector('#formError'),button=document.querySelector('#saveButton');form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));error.hidden=true;if(data.new_password!==data.confirmation){error.textContent='Nove lozinke se ne podudaraju.';error.hidden=false;return}button.disabled=true;button.textContent='Spremanje…';try{await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current_password:data.current_password,new_password:data.new_password})});location.href='login.html?password=changed'}catch(err){error.textContent=err.message;error.hidden=false;button.disabled=false;button.textContent='Spremi novu lozinku'}};</script></body></html>
